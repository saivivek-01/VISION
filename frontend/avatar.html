<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Studio | VISION</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-white min-h-screen flex items-center justify-center px-4">

  <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-2xl">
    <h1 class="text-3xl font-bold text-blue-700 mb-2 text-center">Avatar Studio</h1>
    <p class="text-gray-600 text-center mb-6">
      Upload a photo to create your personal AI tutor avatar
    </p>

    <form id="avatarForm" class="space-y-4">
      <input type="file" id="photo" accept="image/*" required
        class="w-full border border-gray-300 rounded-md px-3 py-2" />

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-semibold">
        Create Avatar
      </button>
    </form>

    <div id="status" class="mt-4 text-sm text-gray-600"></div>

    <div id="preview" class="mt-6 hidden">
      <h3 class="font-semibold mb-2 text-center">Preview</h3>
      <img id="avatarImg" class="mx-auto rounded-xl shadow-md max-h-64" />
      <button onclick="window.location.href='/upload.html'"
        class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-xl">
        Use This Avatar
      </button>
    </div>
    <footer class="mt-16 text-sm text-gray-400 text-center">
      &copy; 2025 VISION by Sai Vivek Mallavalli. All rights reserved.
    </footer>
  </div>

  <script>
    const form = document.getElementById("avatarForm");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const avatarImg = document.getElementById("avatarImg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = " Generating avatar… This may take a minute.";

      const file = document.getElementById("photo").files[0];
      const data = new FormData();
      data.append("photo", file);

      const res = await fetch("/create_avatar", {
        method: "POST",
        body: data
      });

      const result = await res.json();

      if (result.avatar_path) {
        avatarImg.src = "/" + result.avatar_path;
        preview.classList.remove("hidden");
        status.textContent = " Avatar created successfully!";
      } else {
        status.textContent = " Avatar generation failed.";
      }
    });
  </script>

</body>
</html>
